<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050A0E"/>
<title>Game Server Control</title>
<style>
  /* TK-ECLIPSE theme — matched to the desktop logo (red play-mark on near-black). */
  :root {
    --bg0:#0A0405; --bg1:#15090B; --bg2:#1C1014; --bg3:#2A1318;
    --border:#3D1A20; --text:#F0DCDE; --textDim:#8A6B70;
    --accent:#DC1E2D; --accentDim:#7A0E18;
    --good:#FF6B3D; --bad:#6F575A; --warn:#D29922; --info:#E5B0B4;
    --watermark:#5A2E34;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg0);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  a{color:var(--info)}
  header{background:var(--bg1);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:18px;font-weight:700}
  header .url{color:var(--textDim);font-size:12px}
  header .pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600}
  header .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  header .pill.up .dot{background:var(--accent)}
  header button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
  header button:hover{border-color:var(--accent);background:var(--accentDim)}
  main{padding:16px 20px;max-width:1200px;margin:0 auto}
  .card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .card .top{display:flex;align-items:flex-start;gap:12px}
  .card .info{flex:1;min-width:0}
  .card .name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .name .icon{font-size:22px}
  .card .name .type{color:var(--textDim);font-size:13px;font-weight:400}
  .card .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .card .meta .lbl{color:var(--textDim)}
  .pill2{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .pill2 .dot{width:8px;height:8px;border-radius:50%}
  .pill2.invite{background:var(--accentDim);border-color:var(--accent)}
  .pill2.invite .code{font-family:Consolas,Cascadia Mono,monospace;font-weight:700}
  .pill2 button{background:transparent;border:0;color:var(--text);cursor:pointer;font-size:12px;padding:0 2px}
  .toggle{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0;cursor:pointer}
  .toggle input{opacity:0;width:0;height:0}
  .toggle .track{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--border);border-radius:13px;transition:.2s}
  .toggle .thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:.2s}
  .toggle input:checked + .track{background:var(--accent);border-color:var(--accent)}
  .toggle input:checked + .track + .thumb{left:24px}
  .toggle input:disabled + .track{opacity:.5;cursor:default}
  .actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .actions button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
  .actions button:hover{border-color:var(--accent);background:var(--accentDim)}
  .actions button.danger:hover{border-color:var(--accent);background:var(--accent);color:#fff}
  /* Donate / TK-ECLIPSE button — brand color text on dark bg, hover fills crimson */
  .actions a.donate{display:inline-flex;align-items:center;background:var(--bg3);color:var(--accent);border:1px solid var(--accentDim);
                    border-radius:6px;padding:8px 12px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
  .actions a.donate:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .actions button:disabled{opacity:.4;cursor:default;background:var(--bg3);border-color:var(--border)}

  .login{max-width:420px;margin:80px auto;background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:24px}
  .login h2{margin:0 0 16px;font-size:20px}
  .login label{display:block;margin:14px 0 6px;color:var(--textDim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .login input{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:Consolas,Cascadia Mono,monospace;font-size:13px}
  .login button{margin-top:20px;width:100%;background:var(--accent);color:#04150A;border:0;border-radius:6px;padding:12px;font-weight:700;cursor:pointer;font-size:14px}
  .toast{position:fixed;bottom:16px;right:16px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:380px}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{border-color:var(--bad)}
  .toast.ok{border-color:var(--accent)}
  .empty{text-align:center;color:var(--textDim);padding:60px 0}

  /* Update-available banner */
  .updbar{display:none;background:var(--accentDim);border-bottom:1px solid var(--accent);
          padding:8px 20px;color:var(--text);font-size:13px;font-weight:600}
  .updbar.show{display:flex;align-items:center;gap:10px}
  .updbar a{color:#fff;text-decoration:underline;font-weight:700}

  /* TK-ECLIPSE signature stamp */
  .sig{display:inline-flex;align-items:center;gap:6px;font-family:Consolas,"Cascadia Mono",monospace;
       font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--accent);
       background:var(--bg2);border:1px solid var(--accentDim);border-radius:3px;padding:2px 6px;
       text-decoration:none}
  .sig-footer{position:fixed;bottom:8px;left:10px;font-family:Consolas,"Cascadia Mono",monospace;
              font-size:10px;color:var(--watermark);letter-spacing:.5px;pointer-events:none;user-select:none}

  /* Drawer (slide-in panel for Players/Mods/Backups/Logs) */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(540px,100vw);background:var(--bg1);border-left:1px solid var(--border);
          box-shadow:-4px 0 18px rgba(0,0,0,.3);transform:translateX(100%);transition:.25s cubic-bezier(.5,.0,.25,1);z-index:21;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer header{position:static;background:var(--bg2);padding:14px 16px}
  .drawer header h2{margin:0;font-size:16px;font-weight:700}
  .drawer .body{flex:1;overflow:auto;padding:14px 16px}
  .drawer .row{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .drawer .row:last-child{border-bottom:0}
  .drawer .row .grow{flex:1;min-width:0}
  .drawer button.close{margin-left:auto;background:transparent;border:0;color:var(--textDim);font-size:18px;cursor:pointer;padding:0 4px}
  .drawer .footer{padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:8px;flex-wrap:wrap}
  .drawer input[type=text],.drawer input[type=number]{background:var(--bg0);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-size:13px;width:100%}
  .drawer label{color:var(--textDim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px;display:block}
  .drawer .tabs{display:flex;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
  .drawer .tabs button{background:transparent;border:0;color:var(--textDim);font-size:13px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:5px}
  .drawer .tabs button.active{background:var(--bg3);color:var(--text)}
  .badge{font-size:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1px 6px;color:var(--textDim)}
  .badge.ok{color:var(--accent);border-color:var(--accent)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .drawer .mod-row .desc{color:var(--textDim);font-size:12px;margin-top:2px;line-height:1.4}
  .drawer .small{font-size:11.5px;color:var(--textDim)}

  @media (max-width:540px){
    header{padding:10px 12px;flex-wrap:wrap}
    header h1{font-size:15px}
    header .url{display:none}
    main{padding:12px}
    .card .meta{font-size:12px}
    .actions button{padding:9px 11px;font-size:12.5px}
  }
</style>
</head>
<body>

<div id="login" class="login" style="display:none">
  <h2>🎮 Game Server Control</h2>
  <p style="color:var(--textDim);margin:0 0 10px 0">Paste your agent API token to connect.</p>
  <span class="sig" title="TK-ECLIPSE — built by tyrus">TK-ECLIPSE</span>
  <label>Agent URL</label>
  <input id="login-url" type="text" placeholder="http://100.90.15.50:5099"/>
  <label>API Token</label>
  <input id="login-token" type="password" placeholder="bearer token"/>
  <button onclick="login()">Connect</button>
</div>

<div id="app" style="display:none">
  <header>
    <h1>🎮 Game Server Control</h1>
    <span class="sig" title="TK-ECLIPSE — built by tyrus">TK-ECLIPSE</span>
    <div class="url" id="header-url"></div>
    <div class="pill" id="conn"><span class="dot"></span><span id="conn-label">Connecting…</span></div>
    <button onclick="openCreateServer()" style="background:var(--accent);color:#fff;font-weight:700">🚀 Create Server</button>
    <button onclick="refresh()">↻ Refresh</button>
    <button onclick="signout()">⎋ Sign out</button>
  </header>
  <div id="updbar" class="updbar">
    <span>⬆</span>
    <span id="updbar-msg">A new release is available.</span>
    <a id="updbar-link" href="#" target="_blank" rel="noopener noreferrer">View release notes →</a>
  </div>
  <main id="cards"><div class="empty">Loading…</div></main>
</div>

<div id="scrim" class="scrim" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <header>
    <h2 id="drawer-title">…</h2>
    <button class="close" onclick="closeDrawer()" title="Close">✕</button>
  </header>
  <div id="drawer-tabs" class="tabs" style="display:none"></div>
  <div id="drawer-body" class="body"></div>
  <div id="drawer-footer" class="footer" style="display:none"></div>
</div>

<div id="toast" class="toast"></div>
<div class="sig-footer">◢ TK-ECLIPSE</div>

<script>
const $ = sel => document.querySelector(sel);
const fmt = (s) => s == null ? '' : String(s);

// Donate URL — single source of truth, easy to swap if the handle changes.
const DONATE_URL = 'https://paypal.me/TKECLIPSE';

let CFG = { url: '', token: '' };
let SERVERS = [];
let STATUS = {};
let ICONS = {
  Windrose: '⛵', Minecraft: '⛏',
  '896660':'⚔','2394010':'🐾','1690800':'⚙','2430930':'🦖','376030':'🦖',
  '258550':'🔧','294420':'🧟','105600':'🌳','343050':'❄','380870':'🧟'
};

function iconFor(def){
  if (def.gameType === 'Windrose') return ICONS.Windrose;
  if (def.gameType === 'Minecraft') return ICONS.Minecraft;
  if (def.steamAppId && ICONS[def.steamAppId]) return ICONS[def.steamAppId];
  return '🎮';
}

function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className='toast'; }, 2800);
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, {
    'Authorization': 'Bearer ' + CFG.token,
    'Content-Type': 'application/json',
  });
  const r = await fetch(CFG.url + path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (await r.text()));
  if (r.status === 204) return null;
  return r.json();
}

async function loadServers(){
  SERVERS = await api('/api/servers');
  await refresh();
}

async function refresh(){
  try {
    const all = await api('/api/status');
    STATUS = {};
    for (const s of all) STATUS[s.id] = s;
    setConnected(true);
  } catch (e){
    setConnected(false);
    return;
  }
  render();
}

function setConnected(up){
  const pill = $('#conn');
  pill.classList.toggle('up', up);
  $('#conn-label').textContent = up ? ('Connected · ' + CFG.url) : 'Lost contact — retrying…';
}

function vmBadge(s){
  switch (s){
    case 'Running': return ['VM RUNNING', 'var(--good)'];
    case 'Off': return ['VM OFF', 'var(--bad)'];
    case 'NotApplicable': return ['BARE METAL', 'var(--info)'];
    case 'Unknown': return ['VM ?', 'var(--textDim)'];
    default: return ['VM ' + (s||'').toUpperCase(), 'var(--info)'];
  }
}
function procBadge(s, pid){
  switch (s){
    case 'Running': return ['GAME UP' + (pid?' · pid '+pid:''), 'var(--good)'];
    case 'NotRunning': return ['GAME DOWN', 'var(--bad)'];
    default: return ['GAME ?', 'var(--textDim)'];
  }
}

function render(){
  const root = $('#cards');
  if (!SERVERS.length){ root.innerHTML = '<div class="empty">No servers configured.</div>'; return; }
  root.innerHTML = SERVERS.map(def => renderCard(def, STATUS[def.id])).join('');
}

function renderCard(def, st){
  st = st || {};
  const isOn = st.processState === 'Running';
  const isBareMetal = (def.hostingMode||'') === 'BareMetal';
  const hostingLabel = isBareMetal ? 'Bare metal' : ('VM: ' + (def.vmName||''));
  const [vmText, vmColor] = vmBadge(st.vmState);
  const [pText, pColor] = procBadge(st.processState, st.pidInGuest);
  const cpuRam = (st.cpuPercent!=null || st.memoryMB!=null)
    ? `<span class="pill2">${st.cpuPercent!=null?`${(+st.cpuPercent).toFixed(1)}% CPU`:''}${(st.cpuPercent!=null && st.memoryMB!=null)?' · ':''}${st.memoryMB!=null?`${st.memoryMB.toLocaleString()} MB`:''}</span>`
    : '';
  const invite = (st.metadata && st.metadata.InviteCode)
    ? `<span class="pill2 invite">🔗 INVITE <span class="code">${esc(st.metadata.InviteCode)}</span> <button onclick="copyInvite('${esc(st.metadata.InviteCode)}')" title="copy">📋</button></span>`
    : '';
  const hasRcon = (def.rconPort||0) > 0;
  return `
    <div class="card" data-id="${esc(def.id)}">
      <div class="top">
        <div class="info">
          <div class="name"><span class="icon">${iconFor(def)}</span>${esc(def.name)}<span class="type">· ${esc(def.gameType)}</span></div>
          <div class="meta">
            <span class="lbl">${esc(hostingLabel)}</span>
            <span class="pill2"><span class="dot" style="background:${vmColor}"></span>${vmText}</span>
            <span class="pill2"><span class="dot" style="background:${pColor}"></span>${pText}</span>
            ${cpuRam}
            ${invite}
          </div>
        </div>
        <label class="toggle" title="${isOn?'Stop':'Start'}">
          <input type="checkbox" ${isOn?'checked':''} onchange="toggleServer('${esc(def.id)}', this.checked, this)"/>
          <span class="track"></span><span class="thumb"></span>
        </label>
      </div>
      <div class="actions">
        <button onclick="act('${esc(def.id)}','start')">▶ Start</button>
        <button class="danger" onclick="act('${esc(def.id)}','stop')">■ Stop</button>
        <button onclick="act('${esc(def.id)}','restart')">↻ Restart</button>
        <button onclick="act('${esc(def.id)}','backup')">⏷ Backup</button>
        <button onclick="act('${esc(def.id)}','update')">⤓ Update</button>
        ${hasRcon ? `<button onclick="openPlayers('${esc(def.id)}')">👥 Players</button>` : ''}
        <button onclick="openMods('${esc(def.id)}')">🧩 Mods</button>
        <button onclick="openBackups('${esc(def.id)}')">📦 Backups</button>
        <a class="donate" href="${DONATE_URL}" target="_blank" rel="noopener noreferrer"
           title="Support the maintainer · opens PayPal.me/TKECLIPSE">❤ TK-ECLIPSE</a>
      </div>
    </div>`;
}

async function toggleServer(id, desired, el){
  el.disabled = true;
  try {
    const action = desired ? 'start' : 'stop';
    await act(id, action);
  } finally {
    el.disabled = false;
  }
}

async function act(id, action){
  toast(`[${id}] ${action}…`);
  try {
    const r = await api(`/api/servers/${id}/${action}`, { method:'POST' });
    toast(`[${id}] ${r.success?'OK':'FAIL'}: ${r.message}`, r.success?'ok':'err');
    setTimeout(refresh, 1500);
  } catch (e){
    toast(`[${id}] ERROR: ${e.message}`, 'err');
  }
}

function copyInvite(code){
  navigator.clipboard?.writeText(code).then(
    ()=>toast('Invite code copied: '+code, 'ok'),
    ()=>toast('Copy failed','err')
  );
}

// ============= Drawer =============
let drawerCtx = null;
function openDrawer(title){
  drawerCtx = { title };
  $('#drawer-title').textContent = title;
  $('#drawer-tabs').innerHTML = ''; $('#drawer-tabs').style.display = 'none';
  $('#drawer-body').innerHTML = '<div class="empty">Loading…</div>';
  $('#drawer-footer').innerHTML = ''; $('#drawer-footer').style.display = 'none';
  $('#drawer').classList.add('show');
  $('#scrim').classList.add('show');
}
function closeDrawer(){
  $('#drawer').classList.remove('show');
  $('#scrim').classList.remove('show');
}

// ----- Create Server drawer (the marquee feature) -----
// Same curated game list as the WPF wizard. Steam app IDs are authoritative; preset values
// are duplicated client-side because the agent's /install endpoint takes a fully-resolved ServerDef.
const CREATE_GAMES = [
  { key:'valheim',      label:'Valheim',                  icon:'⚔',  appId:'896660',  size:'~1 GB',   dir:'Valheim',       exe:'valheim_server.exe',                                        args:['-nographics','-batchmode','-name','MyServer','-port','2456','-world','MyWorld','-password','secret'] },
  { key:'palworld',     label:'Palworld',                 icon:'🐾', appId:'2394010', size:'~7 GB',   dir:'PalServer',     exe:'PalServer\\PalServer.exe',                                  args:['-useperfthreads','-NoAsyncLoadingThread','-UseMultithreadForDS','EpicApp=PalServer'] },
  { key:'satisfactory', label:'Satisfactory',             icon:'⚙',  appId:'1690800', size:'~12 GB',  dir:'Satisfactory',   exe:'FactoryServer.exe',                                         args:['-log','-unattended'] },
  { key:'ark-asa',      label:'ARK: Survival Ascended',   icon:'🦖', appId:'2430930', size:'~50 GB',  dir:'ArkAscended',   exe:'ShooterGame\\Binaries\\Win64\\ArkAscendedServer.exe',        args:['TheIsland_WP?listen?MaxPlayers=20?ServerPassword=?ServerAdminPassword=changeme'] },
  { key:'ark-se',       label:'ARK: Survival Evolved',    icon:'🦖', appId:'376030',  size:'~14 GB',  dir:'ArkSE',         exe:'ShooterGame\\Binaries\\Win64\\ShooterGameServer.exe',        args:['TheIsland?listen?MaxPlayers=20?ServerAdminPassword=changeme','-server','-log'] },
  { key:'rust',         label:'Rust',                     icon:'🔧', appId:'258550',  size:'~8 GB',   dir:'Rust',          exe:'RustDedicated.exe',                                         args:['-batchmode','+server.port','28015','+rcon.port','28016','+rcon.password','changeme','+server.hostname','My Rust Server'] },
  { key:'7dtd',         label:'7 Days to Die',            icon:'🧟', appId:'294420',  size:'~2 GB',   dir:'SevenDaysToDie',exe:'7DaysToDieServer.exe',                                      args:['-quit','-batchmode','-nographics','-configfile=serverconfig.xml'] },
  { key:'terraria',     label:'Terraria',                 icon:'🌳', appId:'105600',  size:'~0.5 GB', dir:'Terraria',      exe:'TerrariaServer.exe',                                        args:['-config','serverconfig.txt'] },
  { key:'dst',          label:"Don't Starve Together",    icon:'❄',  appId:'343050',  size:'~1 GB',   dir:'DST',           exe:'bin\\dontstarve_dedicated_server_nullrenderer.exe',         args:['-console','-cluster','MyCluster','-shard','Master'] },
  { key:'zomboid',      label:'Project Zomboid',          icon:'🧟', appId:'380870',  size:'~1 GB',   dir:'ProjectZomboid',exe:'StartServer64.bat',                                         args:[] },
];

let CREATE_STATE = { step:1, game:null, jobId:null };

function openCreateServer(){
  CREATE_STATE = { step:1, game:null, jobId:null };
  openDrawer('🚀 Create Server');
  drawerCtx = { kind:'create' };
  renderCreateStep();
}

function renderCreateStep(){
  if (CREATE_STATE.step === 1){
    // Step 1: game picker
    $('#drawer-body').innerHTML = `
      <div style="margin-bottom:12px;color:var(--textDim);font-size:12px">Pick a dedicated server to install. SteamCMD does the heavy lifting.</div>
      ${CREATE_GAMES.map(g => `
        <div class="row" style="cursor:pointer" onclick="pickCreateGame('${g.key}')">
          <div style="font-size:28px;margin-right:8px">${g.icon}</div>
          <div class="grow">
            <div style="font-weight:600">${esc(g.label)}</div>
            <div class="small">App ID ${g.appId} · est. ${esc(g.size)}</div>
          </div>
          <div style="color:var(--textDim)">❯</div>
        </div>
      `).join('')}`;
    $('#drawer-footer').style.display = 'none';
  } else if (CREATE_STATE.step === 2){
    // Step 2: name + path
    const g = CREATE_STATE.game;
    const defaultPath = `C:\\GameServers\\${g.dir}`;
    $('#drawer-body').innerHTML = `
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">${g.icon}  ${esc(g.label)}  ·  Steam App ID ${g.appId}</div>
      <label>Display name</label>
      <input type="text" id="cs-name" value="${esc(g.label)}"/>
      <label>ID (lowercase, dashes only)</label>
      <input type="text" id="cs-id" value="${slugify(g.label)}" style="font-family:Consolas,monospace"/>
      <label>Install location</label>
      <input type="text" id="cs-path" value="${esc(defaultPath)}" style="font-family:Consolas,monospace"/>
      <div style="background:var(--bg2);border:1px solid var(--accentDim);border-radius:6px;padding:10px;margin-top:14px;font-size:11px;color:var(--textDim);font-family:Consolas,monospace">
        EXE: <span id="cs-preview-exe"></span><br/>
        ARGS: ${esc(g.args.join(' ') || '(none)')}
      </div>
      <div id="cs-err" style="color:var(--accent);margin-top:10px;display:none"></div>`;
    document.getElementById('cs-name').addEventListener('input', updateCreatePreview);
    document.getElementById('cs-id').addEventListener('input', updateCreatePreview);
    document.getElementById('cs-path').addEventListener('input', updateCreatePreview);
    updateCreatePreview();
    $('#drawer-footer').style.display = 'flex';
    $('#drawer-footer').innerHTML = `
      <button onclick="createBack()">← Back</button>
      <button style="background:var(--accent);color:#fff;font-weight:700" onclick="createInstall()">⬇ Install</button>`;
  } else {
    // Step 3: progress
    const g = CREATE_STATE.game;
    $('#drawer-body').innerHTML = `
      <div id="cs-progress-header" style="font-size:16px;font-weight:700;margin-bottom:10px">Installing ${esc(g.label)}…</div>
      <div style="height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:10px">
        <div id="cs-bar" style="height:100%;width:0%;background:var(--accent);transition:width .25s"></div>
      </div>
      <div id="cs-status" class="small" style="margin-bottom:8px">Queued…</div>
      <pre id="cs-log" style="background:var(--bg0);border:1px solid var(--border);border-radius:4px;padding:10px;font-size:11px;color:var(--textDim);max-height:340px;overflow:auto;white-space:pre-wrap;margin:0"></pre>`;
    $('#drawer-footer').style.display = 'flex';
    $('#drawer-footer').innerHTML = `
      <button id="cs-done" onclick="closeDrawer()" disabled style="opacity:.5">Done</button>`;
  }
}

function pickCreateGame(key){
  CREATE_STATE.game = CREATE_GAMES.find(g => g.key === key);
  CREATE_STATE.step = 2;
  renderCreateStep();
}
function createBack(){
  if (CREATE_STATE.step > 1){ CREATE_STATE.step--; renderCreateStep(); }
}
function updateCreatePreview(){
  const g = CREATE_STATE.game;
  const p = (document.getElementById('cs-path')?.value || '').trim().replace(/[\\\/]+$/,'');
  document.getElementById('cs-preview-exe').textContent = p + '\\' + g.exe;
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

async function createInstall(){
  const g = CREATE_STATE.game;
  const name = (document.getElementById('cs-name').value || '').trim();
  const id   = (document.getElementById('cs-id').value || '').trim();
  const path = (document.getElementById('cs-path').value || '').trim().replace(/[\\\/]+$/,'');
  const errEl = document.getElementById('cs-err');
  errEl.style.display = 'none';
  if (!name)               { errEl.textContent = 'Display name required.'; errEl.style.display = 'block'; return; }
  if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(id)) { errEl.textContent = 'ID must be lowercase letters, digits, and hyphens.'; errEl.style.display = 'block'; return; }
  if (!path)               { errEl.textContent = 'Install location required.'; errEl.style.display = 'block'; return; }

  const def = {
    id, name, vmName: '', gameType: 'SteamGeneric',
    guestExePath: path + '\\' + g.exe,
    guestWorkingDir: path,
    startArgs: g.args,
    saveDirs: [],
    steamAppId: g.appId,
    guestCredentialId: 'default',
    logPathInGuest: null, rconHost: 'auto', rconPort: null, rconPassword: null,
    hostingMode: 'BareMetal',
    scheduledTaskName: null, stopProcessNames: null, discordWebhookUrl: null
  };

  CREATE_STATE.step = 3;
  renderCreateStep();
  appendCreateLog('$ steamcmd +force_install_dir "' + path + '" +login anonymous +app_update ' + g.appId + ' validate +quit');

  try {
    const ack = await api('/api/servers/install', {
      method:'POST', body: JSON.stringify({ steamAppId: g.appId, installPath: path, serverDef: def })
    });
    CREATE_STATE.jobId = ack.jobId;
    document.getElementById('cs-status').textContent = 'Job: ' + ack.jobId + ' (live updates via SignalR or polling)';
    // Polling fallback in case SignalR can't push (we don't connect SignalR from the web UI today).
    pollInstallProgress(ack.jobId);
  } catch (e) {
    appendCreateLog('ERROR: ' + e.message);
    document.getElementById('cs-status').textContent = 'Install request failed.';
    document.getElementById('cs-done').disabled = false;
    document.getElementById('cs-done').style.opacity = '1';
  }
}

async function pollInstallProgress(jobId){
  let lastLine = '';
  while (true){
    try {
      const p = await api('/api/servers/install/' + jobId);
      if (!p) { await new Promise(r => setTimeout(r, 2000)); continue; }
      if (p.line && p.line !== lastLine){ appendCreateLog(p.line); lastLine = p.line; }
      if (typeof p.percentHint === 'number'){ document.getElementById('cs-bar').style.width = p.percentHint + '%'; }
      document.getElementById('cs-status').textContent = ({
        'queued':'Queued…',
        'steamcmd': p.percentHint != null ? `SteamCMD · ${p.percentHint}%` : 'SteamCMD running…',
        'register':'Registering with dashboard…',
        'done':'✅ Done — server is ready.',
        'failed':'❌ Failed — see log above.'
      })[p.phase] || p.phase;
      if (p.finished){
        document.getElementById('cs-progress-header').textContent = p.success
          ? '✅ ' + CREATE_STATE.game.label + ' installed.'
          : '❌ Install failed.';
        if (p.success) { document.getElementById('cs-bar').style.width = '100%'; refresh(); }
        document.getElementById('cs-done').disabled = false;
        document.getElementById('cs-done').style.opacity = '1';
        return;
      }
    } catch (e){ appendCreateLog('(progress poll: ' + e.message + ')'); }
    await new Promise(r => setTimeout(r, 1500));
  }
}

function appendCreateLog(line){
  const el = document.getElementById('cs-log');
  if (!el) return;
  el.textContent += line + '\n';
  // Cap to keep the DOM small on multi-hour ARK installs.
  if (el.textContent.length > 50000) el.textContent = el.textContent.slice(-40000);
  el.scrollTop = el.scrollHeight;
}

// ----- Players drawer -----
async function openPlayers(id){
  const def = SERVERS.find(s=>s.id===id);
  openDrawer(`👥 Players — ${def?.name||id}`);
  drawerCtx = { kind:'players', id, def };
  await reloadPlayers();
  $('#drawer-footer').style.display = 'flex';
  $('#drawer-footer').innerHTML = `
    <button onclick="reloadPlayers()">↻ Refresh</button>
    <input id="bcast" placeholder="broadcast message" style="flex:1;background:var(--bg0);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px 9px"/>
    <button onclick="broadcast()">📢 Send</button>`;
}
async function reloadPlayers(){
  try {
    const players = await api(`/api/servers/${drawerCtx.id}/rcon/players`);
    if (!players || !players.length){
      $('#drawer-body').innerHTML = '<div class="empty">No players online.</div>';
      return;
    }
    $('#drawer-body').innerHTML = players.map(p => `
      <div class="row">
        <div class="grow">
          <div style="font-weight:600">${esc(p.name||'?')}</div>
          <div class="small">Steam: ${esc(p.steamId||'?')}</div>
        </div>
        <button onclick="rcon('KickPlayer','${esc(p.steamId)}','Kicked ${esc(p.name)}')">✕ Kick</button>
        <button class="danger" onclick="confirmBan('${esc(p.steamId)}','${esc(p.name)}')">🚫 Ban</button>
      </div>`).join('');
  } catch(e){ $('#drawer-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function rcon(cmd, payload, okMsg){
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/rcon/command`, {
      method:'POST', body: JSON.stringify({ command: cmd, payload })
    });
    toast(r.success ? okMsg : ('Failed: ' + (r.error||'?')), r.success?'ok':'err');
    if (cmd === 'KickPlayer' || cmd === 'BanPlayer') reloadPlayers();
  } catch(e){ toast('RCON failed: ' + e.message, 'err'); }
}
function confirmBan(sid, name){
  if (!confirm(`Ban ${name} (${sid})?`)) return;
  rcon('BanPlayer', sid, `Banned ${name}`);
}
function broadcast(){
  const t = ($('#bcast')?.value || '').trim();
  if (!t) return;
  rcon('BroadcastMessage', t, 'Broadcast sent');
  $('#bcast').value = '';
}

// ----- Mods drawer -----
async function openMods(id){
  const def = SERVERS.find(s=>s.id===id);
  openDrawer(`🧩 Mods — ${def?.name||id}`);
  drawerCtx = { kind:'mods', id, def, modTab: 'installed' };
  $('#drawer-tabs').style.display = 'flex';
  $('#drawer-tabs').innerHTML = `
    <button id="tab-installed" class="active" onclick="switchModTab('installed')">📦 Installed</button>
    <button id="tab-browse" onclick="switchModTab('browse')">🔎 Browse</button>`;
  await loadInstalledMods();
}
async function switchModTab(tab){
  drawerCtx.modTab = tab;
  document.querySelectorAll('#drawer-tabs button').forEach(b=>b.classList.toggle('active', b.id==='tab-'+tab));
  if (tab === 'installed') loadInstalledMods();
  else loadBrowseMods('');
}
async function loadInstalledMods(){
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/mods`);
    if (!r.supported){
      $('#drawer-body').innerHTML = `<div class="empty">${esc(r.unsupportedReason || 'Not supported.')}</div>`;
      $('#drawer-footer').style.display = 'none';
      return;
    }
    if (!r.mods.length){
      $('#drawer-body').innerHTML = `<div class="empty">No mods installed.<br><span class="small">Folder: ${esc(r.modsFolder||'')}</span></div>`;
    } else {
      $('#drawer-body').innerHTML = r.mods.map(m => `
        <div class="row mod-row">
          <div class="grow">
            <div style="font-weight:600">${esc(m.displayName)} ${m.version ? `<span class="small">v${esc(m.version)}</span>`:''}</div>
            <div class="small">${esc(m.modId)} · ${(m.sizeBytes/1024|0).toLocaleString()} KB</div>
          </div>
          <button class="danger" onclick="uninstallMod('${esc(m.modId)}')">🗑</button>
        </div>`).join('');
    }
    $('#drawer-footer').style.display = 'flex';
    $('#drawer-footer').innerHTML = `
      <button onclick="checkModUpdates()">🔄 Check updates</button>
      <input id="mod-url" type="text" placeholder=".zip URL" style="flex:1"/>
      <button onclick="installModUrl()">⬇ Install</button>`;
  } catch(e){ $('#drawer-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function checkModUpdates(){
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/mods/updates`);
    if (!r.updates.length){ toast('All mods up to date.', 'ok'); return; }
    if (!confirm(`Update ${r.updates.length} mod(s)?\n\n` + r.updates.map(u=>`${u.displayName}: ${u.installedVersion||'?'} → ${u.latestVersion}`).join('\n'))) return;
    for (const u of r.updates){
      toast('Updating ' + u.displayName + '…');
      await api(`/api/servers/${drawerCtx.id}/mods/${encodeURIComponent(u.modId)}/update`, {
        method:'POST', body: JSON.stringify({ url: u.latestDownloadUrl, displayName: u.displayName })
      });
    }
    toast(`Updated ${r.updates.length} mod(s) — restart the server.`, 'ok');
    loadInstalledMods();
  } catch(e){ toast('Update failed: ' + e.message, 'err'); }
}
async function installModUrl(){
  const url = ($('#mod-url')?.value || '').trim();
  if (!url) return;
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/mods/install`, {
      method:'POST', body: JSON.stringify({ url, displayName: null })
    });
    if (r.ok){ toast(`Installed ${r.mod.displayName}`, 'ok'); loadInstalledMods(); }
    else { toast('Install failed: ' + (r.error||'?'), 'err'); }
  } catch(e){ toast('Install failed: ' + e.message, 'err'); }
}
async function uninstallMod(modId){
  if (!confirm('Uninstall ' + modId + '?')) return;
  try { await api(`/api/servers/${drawerCtx.id}/mods/${encodeURIComponent(modId)}`, { method:'DELETE' }); toast('Uninstalled.', 'ok'); loadInstalledMods(); }
  catch(e){ toast('Uninstall failed: ' + e.message, 'err'); }
}
async function loadBrowseMods(q){
  $('#drawer-body').innerHTML = '<div class="empty">Searching…</div>';
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/mods/search?q=${encodeURIComponent(q||'')}&limit=30`);
    if (!r.supported){
      $('#drawer-body').innerHTML = `<div class="empty">${esc(r.unsupportedReason || 'Not supported.')}</div>`;
      return;
    }
    const list = r.results.map(m => `
      <div class="row mod-row">
        <div class="grow">
          <div style="font-weight:600">${esc(m.name)} <span class="small">by ${esc(m.owner)} · v${esc(m.version)}</span></div>
          <div class="desc">${esc(m.description||'')}</div>
          <div class="small" style="margin-top:4px">
            ⬇ ${m.downloads.toLocaleString()}
            ${m.serverSideOnly ? '<span class="badge ok">SERVER-SIDE</span>' : '<span class="badge warn">CLIENT REQ</span>'}
            ${m.deprecated ? '<span class="badge warn">DEPRECATED</span>' : ''}
          </div>
        </div>
        <button onclick="installFrom('${esc(m.downloadUrl)}','${esc(m.name)}')">⬇</button>
      </div>`).join('');
    $('#drawer-body').innerHTML = list || '<div class="empty">No matches.</div>';
    $('#drawer-footer').style.display = 'flex';
    $('#drawer-footer').innerHTML = `
      <input id="mod-q" placeholder="search ${esc(r.source||'')}" style="flex:1" onkeydown="if(event.key==='Enter')loadBrowseMods(this.value)"/>
      <button onclick="loadBrowseMods(document.getElementById('mod-q').value)">🔎</button>`;
  } catch(e){ $('#drawer-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function installFrom(url, name){
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/mods/install`, {
      method:'POST', body: JSON.stringify({ url, displayName: name })
    });
    if (r.ok) toast('Installed ' + r.mod.displayName, 'ok');
    else toast('Failed: ' + (r.error||'?'), 'err');
  } catch(e){ toast('Install failed: ' + e.message, 'err'); }
}

// ----- Backups drawer -----
async function openBackups(id){
  const def = SERVERS.find(s=>s.id===id);
  openDrawer(`📦 Backups — ${def?.name||id}`);
  drawerCtx = { kind:'backups', id, def };
  await reloadBackups();
  $('#drawer-footer').style.display = 'flex';
  $('#drawer-footer').innerHTML = `
    <button onclick="reloadBackups()">↻ Refresh</button>
    <button onclick="newBackup()">⏷ Backup now</button>`;
}
async function reloadBackups(){
  try {
    const list = await api(`/api/servers/${drawerCtx.id}/backups`);
    if (!list.length){
      $('#drawer-body').innerHTML = '<div class="empty">No backups yet.</div>';
      return;
    }
    $('#drawer-body').innerHTML = list.map(b => `
      <div class="row">
        <div class="grow">
          <div style="font-weight:600">${esc(b.checkpointName)}</div>
          <div class="small">${new Date(b.createdAt).toLocaleString()} · ${(b.sizeBytes||0)>(1<<20) ? ((b.sizeBytes/(1<<20))|0)+' MB' : ((b.sizeBytes/(1<<10))|0)+' KB'}</div>
        </div>
        <button onclick="restoreBackup('${esc(b.checkpointName)}')">↶ Restore</button>
        <button class="danger" onclick="deleteBackup('${esc(b.checkpointName)}')">🗑</button>
      </div>`).join('');
  } catch(e){ $('#drawer-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function newBackup(){
  await act(drawerCtx.id, 'backup');
  setTimeout(reloadBackups, 1500);
}
async function restoreBackup(name){
  if (!confirm(`Restore from ${name}?\n\nStop the server first. Current saves will be moved to a 'pre-restore' safety backup.`)) return;
  try {
    const r = await api(`/api/servers/${drawerCtx.id}/backups/${encodeURIComponent(name)}/restore`, { method:'POST' });
    toast(r.success ? 'Restore complete' : ('Restore failed: ' + r.message), r.success?'ok':'err');
    reloadBackups();
  } catch(e){ toast('Restore failed: ' + e.message, 'err'); }
}
async function deleteBackup(name){
  if (!confirm('Delete backup ' + name + '?')) return;
  try { await api(`/api/servers/${drawerCtx.id}/backups/${encodeURIComponent(name)}`, { method:'DELETE' }); toast('Deleted.', 'ok'); reloadBackups(); }
  catch(e){ toast('Delete failed: ' + e.message, 'err'); }
}

function login(){
  const url = $('#login-url').value.trim().replace(/\/+$/,'');
  const tok = $('#login-token').value.trim();
  if (!url || !tok){ toast('Need both fields', 'err'); return; }
  CFG = { url, token: tok };
  localStorage.setItem('gsc', JSON.stringify(CFG));
  start();
}

function signout(){
  localStorage.removeItem('gsc');
  CFG = { url:'', token:'' };
  $('#app').style.display = 'none';
  $('#login').style.display = 'block';
  $('#login-url').value = '';
  $('#login-token').value = '';
}

async function start(){
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  $('#header-url').textContent = '· ' + CFG.url;
  try {
    await api('/api/health');
    await loadServers();
    checkUpdates();   // fire-and-forget — banner appears asynchronously when result lands
    setInterval(refresh, 5000);
  } catch (e){
    toast('Could not reach agent: '+e.message, 'err');
    signout();
  }
}

async function checkUpdates(){
  try {
    const v = await api('/api/version');
    if (!v || !v.updateAvailable) return;
    const bar = $('#updbar');
    $('#updbar-msg').textContent = `Version ${v.latestVersion} is available — you are running ${v.currentVersion}.`;
    if (v.latestUrl){ $('#updbar-link').href = v.latestUrl; $('#updbar-link').style.display = ''; }
    else { $('#updbar-link').style.display = 'none'; }
    bar.classList.add('show');
  } catch { /* ignore — not worth shouting about */ }
}

// Boot
(function(){
  // Allow token via URL: ?token=xxx[&url=http://...]
  const params = new URLSearchParams(location.search);
  if (params.has('token')){
    CFG.token = params.get('token');
    CFG.url = params.get('url') || (location.origin);
    localStorage.setItem('gsc', JSON.stringify(CFG));
    history.replaceState({}, '', location.pathname);
    start();
    return;
  }
  const saved = localStorage.getItem('gsc');
  if (saved){
    try { CFG = JSON.parse(saved); if (CFG.token && CFG.url){ start(); return; } } catch{}
  }
  $('#login').style.display = 'block';
  $('#login-url').value = location.origin;
})();

// ESC closes drawer
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
</script>
</body>
