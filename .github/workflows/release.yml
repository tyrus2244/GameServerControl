name: Release

# Triggers on annotated tags matching v* (e.g. v1.0.0). Builds the three deployable
# zips and attaches them to a GitHub Release. The in-app updater + one-line installers
# both fetch from /releases/latest, so the asset names below are load-bearing — don't
# rename without updating deploy/windows/install.ps1 and deploy/linux/install-from-release.sh.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create releases + upload assets

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # We let `publish` do its own build because the RID-specific output it needs
      # isn't produced by a plain `dotnet build` (which is AnyCPU). The cost is a
      # second compile per project — small in CI relative to download + zip time.
      - name: Publish agent (win-x64)
        run: dotnet publish src/GameServerControl.Agent -c Release -r win-x64 --self-contained false -o publish/Agent-windows

      - name: Publish client (win-x64)
        run: dotnet publish src/GameServerControl.Client -c Release -r win-x64 --self-contained false -o publish/Client-windows

      - name: Zip agent
        run: Compress-Archive -Path publish/Agent-windows/* -DestinationPath GameServerControl-Agent-windows.zip
        shell: pwsh

      - name: Zip client
        run: Compress-Archive -Path publish/Client-windows/* -DestinationPath GameServerControl-Client-windows.zip
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Client-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish agent (linux-x64)
        run: |
          dotnet restore src/GameServerControl.Agent
          dotnet publish src/GameServerControl.Agent -c Release -r linux-x64 --self-contained false -o publish/Agent-linux

      # Bundle systemd unit + bootstrap install scripts inside the tarball so end users
      # only need to download one file. The release-mode installer expects them here.
      - name: Stage deploy artifacts
        run: |
          cp deploy/linux/gameservercontrol-agent.service publish/Agent-linux/
          cp deploy/linux/install-from-release.sh publish/Agent-linux/
          chmod +x publish/Agent-linux/install-from-release.sh

      - name: Tarball agent
        run: tar -czf GameServerControl-Agent-linux.tar.gz -C publish/Agent-linux .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: GameServerControl-Agent-linux.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS artifacts (arm64 + x64)
    # macos-latest is Apple Silicon since GitHub's 2024 migration, but `dotnet publish` can
    # cross-compile to either RID, so we publish both off the same runner.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/GameServerControl.Agent

      - name: Publish agent (osx-arm64)
        run: dotnet publish src/GameServerControl.Agent -c Release -r osx-arm64 --self-contained false -o publish/Agent-macos-arm64

      - name: Publish agent (osx-x64)
        run: dotnet publish src/GameServerControl.Agent -c Release -r osx-x64 --self-contained false -o publish/Agent-macos-x64

      - name: Stage deploy artifacts (arm64)
        run: |
          cp deploy/macos/com.tk-eclipse.gameservercontrol-agent.plist publish/Agent-macos-arm64/
          cp deploy/macos/install-from-release.sh                       publish/Agent-macos-arm64/
          chmod +x publish/Agent-macos-arm64/install-from-release.sh
          chmod +x publish/Agent-macos-arm64/GameServerControl.Agent || true

      - name: Stage deploy artifacts (x64)
        run: |
          cp deploy/macos/com.tk-eclipse.gameservercontrol-agent.plist publish/Agent-macos-x64/
          cp deploy/macos/install-from-release.sh                       publish/Agent-macos-x64/
          chmod +x publish/Agent-macos-x64/install-from-release.sh
          chmod +x publish/Agent-macos-x64/GameServerControl.Agent || true

      - name: Tarball both arches
        run: |
          tar -czf GameServerControl-Agent-macos-arm64.tar.gz -C publish/Agent-macos-arm64 .
          tar -czf GameServerControl-Agent-macos-x64.tar.gz   -C publish/Agent-macos-x64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-tars
          path: |
            GameServerControl-Agent-macos-arm64.tar.gz
            GameServerControl-Agent-macos-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # for CHANGELOG + scripts

      - name: Download Windows zips
        uses: actions/download-artifact@v4
        with:
          name: windows-zips

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: linux-tar

      - name: Download macOS tarballs
        uses: actions/download-artifact@v4
        with:
          name: macos-tars

      - name: Stage installer scripts as release assets
        run: |
          cp deploy/windows/install.ps1            GameServerControl-Install-Windows.ps1
          cp deploy/linux/install-from-release.sh  GameServerControl-Install-Linux.sh
          cp deploy/macos/install-from-release.sh  GameServerControl-Install-macOS.sh

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            GameServerControl-Agent-windows.zip
            GameServerControl-Client-windows.zip
            GameServerControl-Agent-linux.tar.gz
            GameServerControl-Agent-macos-arm64.tar.gz
            GameServerControl-Agent-macos-x64.tar.gz
            GameServerControl-Install-Windows.ps1
            GameServerControl-Install-Linux.sh
            GameServerControl-Install-macOS.sh
          body: |
            ## TK-ECLIPSE GameServerControl ${{ steps.tag.outputs.tag }}

            ### One-line install

            **Windows** (PowerShell as Administrator):
            ```powershell
            iwr https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/windows/install.ps1 | iex
            ```

            **Linux** (any modern distro with systemd):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/linux/install-from-release.sh | sudo bash
            ```

            **macOS** (Apple Silicon or Intel — no sudo needed):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/macos/install-from-release.sh | bash
            ```

            ### Manual install

            Download the appropriate zip/tarball below, extract, and follow the README. The agent generates an API token on first boot — paste it into the dashboard.

            ---

            🤖 Built by TK-ECLIPSE  ·  ❤ [Donate via PayPal](https://paypal.me/TKECLIPSE)
